name: Amnesia Browser CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Nightly build at 2 AM UTC

env:
  QT_VERSION: 6.6.0
  DEPOT_TOOLS_PATH: ${{ github.workspace }}/depot_tools

jobs:
  setup-environment:
    runs-on: ubuntu-latest
    outputs:
      depot-tools-path: ${{ steps.setup.outputs.depot-tools-path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $DEPOT_TOOLS_PATH
          echo "$DEPOT_TOOLS_PATH" >> $GITHUB_PATH

      - name: Setup output
        id: setup
        run: echo "depot-tools-path=$DEPOT_TOOLS_PATH" >> $GITHUB_OUTPUT

  build-linux:
    needs: setup-environment
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git gnupg flex bison gperf \
            build-essential zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 lib32z1-dev lib32ncurses6-dev x11proto-core-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-util0-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render0-dev \
            libxcbShape-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libxcb-xkb-dev libxcb-xrm-dev libxcb-xinput-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libudev-dev libpci-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libxss-dev \
            libxtst-dev libnss3-dev libatk1.0-dev libatk-bridge2.0-dev \
            libcups2-dev libdrm-dev libxcomposite-dev libxdamage-dev libxrandr-dev \
            libpango1.0-dev libcairo2-dev libatspi2.0-dev libgtk-3-dev

      - name: Configure build
        run: |
          mkdir -p out/Default
          gn gen out/Default --args="$(cat AmnesiaBrowser/build_configs/linux/args.gn)"

      - name: Build Amnesia Browser
        run: |
          autoninja -C out/Default amnesia_browser

      - name: Run unit tests
        run: |
          ./out/Default/amnesia_browser_unittests --gtest_filter='*'

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amnesia-browser-linux
          path: out/Default/amnesia_browser

  build-macos:
    needs: setup-environment
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $DEPOT_TOOLS_PATH
          echo "$DEPOT_TOOLS_PATH" >> $GITHUB_PATH

      - name: Configure build
        run: |
          mkdir -p out/Default
          gn gen out/Default --args="$(cat AmnesiaBrowser/build_configs/mac/args.gn)"

      - name: Build Amnesia Browser
        run: |
          autoninja -C out/Default amnesia_browser

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amnesia-browser-macos
          path: out/Default/amnesia_browser.app

  build-windows:
    needs: setup-environment
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $DEPOT_TOOLS_PATH
          echo "$DEPOT_TOOLS_PATH" >> $env:GITHUB_PATH

      - name: Configure build
        run: |
          mkdir out\Default
          gn gen out\Default --args="$(Get-Content AmnesiaBrowser\build_configs\windows\args.gn -Raw)"

      - name: Build Amnesia Browser
        run: |
          autoninja -C out\Default amnesia_browser

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amnesia-browser-windows
          path: out\Default\amnesia_browser.exe

  security-scan:
    needs: setup-environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run security audit
        run: |
          # Placeholder for security audit tools
          echo "Running security audit..."
          # clang-tidy, cppcheck, etc.

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: security_report.*

  release:
    needs: [build-linux, build-macos, build-windows, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly-${{ github.run_number }}
          name: Nightly Build ${{ github.run_number }}
          files: artifacts/**/*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

[build-system]
requires = ["setuptools>=61.0", "wheel", "scikit-build", "cmake>=3.20"]
build-backend = "setuptools.build_meta"

[project]
name = "amnesia-browser"
version = "0.1.0-alpha"
description = "متصفح ويب مقاوم للبصمة الرقمية بآلية إعادة ضبط ذاتية كاملة"
readme = "README.md"
license = {text = "TBD"}
authors = [
    {name = "Amnesia Browser Team", email = "team@amnesia-browser.org"}
]
keywords = ["browser", "privacy", "fingerprinting", "anonymity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Topic :: Security :: Cryptography",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://amnesia-browser.org"
Repository = "https://github.com/amnesia-browser/amnesia"
Documentation = "https://docs.amnesia-browser.org"

[tool.cmake]
minimum-version = "3.20"

[tool.cmake.override]
cxx-standard = "17"
cxx-standard-required = "ON"

[tool.setuptools.packages.find]
where = ["src"]
include = ["amnesia*"]

[tool.setuptools.package-data]
amnesia = [
    "resources/**/*",
    "build_configs/**/*",
    "profiles/**/*",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "selenium>=4.0",
    "playwright>=1.40",
]
